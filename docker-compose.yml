services:
  db:
    image: postgres:17-alpine
    container_name: house_prices_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: house_prices
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d house_prices"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - house_network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house_prices_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: house_prices
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - house_network

volumes:
  postgres_data:
    driver: local

networks:
  house_network:
    driver: bridge
